<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Nowoczesny gradient dla akcentów technologicznych -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe7b00" />
     
    </linearGradient>
    
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>



  <g filter="url(#glow)">

    <path d="M 96 112 
             L 416 112 
             A 24 24 0 0 1 440 136 
             L 440 328 
             A 24 24 0 0 1 416 352 
             L 96 352 
             A 24 24 0 0 1 72 328 
             L 72 136 
             A 24 24 0 0 1 96 112 Z" 
          fill="none" 
          stroke="url(#techGradient)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />


    <path d="M 192 400 
             L 320 400 
             M 256 352 
             L 256 400" 
          fill="none" 
          stroke="url(#techGradient)" 
          stroke-width="20" 
          stroke-linecap="round" />
  

    <!-- Symbol kodu / IT wewnątrz ekranu (< / >) -->
    <path d="M 190 200 
             L 150 232 
             L 190 264" 
          fill="none" 
          stroke="#fe7b00" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 322 200 
             L 362 232 
             L 322 264" 
          fill="none" 
          stroke="#fe7b00" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Środkowy separator (kod / stabilność) -->
    <line x1="266" y1="190" x2="246" y2="274" 
          stroke="url(#techGradient)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Element e-commerce: ikona koszyka w prawym dolnym rogu ekranu -->
    <g transform="translate(350, 260) scale(0.65)">
      <circle cx="25" cy="45" r="6" fill="#fe7b00" />
      <circle cx="55" cy="45" r="6" fill="#f16e16" />
      <path d="M 5 10 
               L 18 10 
               L 28 35 
               L 55 35 
               L 63 18 
               L 23 18" 
            fill="none" 
            stroke="#fe7b00" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>
</svg>
